<section class="common-padding">
  <div class="screen-max-width">
    <h1 id="heading" class="section-heading">Take a closer look.</h1>

    <div class="flex flex-col items-center mt-5">
      <div class="w-full h-[75vh] md:h-[90vh] overflow-hidden relative">
        <app-model-view
          #smallView
          [index]="1"
          gsapType="view1"
          [item]="model"
          [size]="size"
          (rotationChange)="onSmallRotationChange($event)"
        ></app-model-view>

        <app-model-view
          #largeView
          [index]="2"
          gsapType="view2"
          [item]="model"
          [size]="size"
          (rotationChange)="onLargeRotationChange($event)"
        ></app-model-view>

        <!--
          Host do canvas compartilhado. O ModelViewerService injeta aqui o
          <canvas> único usado pelas duas viewports (equivalente ao <Canvas>
          do react-three/fiber com eventSource={document.getElementById('root')}).
        -->
        <div #canvasHost class="canvas-host"></div>
      </div>

      <div class="mx-auto w-full">
        <p class="text-sm font-light text-center mb-5">{{ model.title }}</p>

        <div class="flex-center">
          <ul class="color-container">
            <li
              onkeypress=""
              *ngFor="let item of models; let i = index"
              class="w-6 h-6 rounded-full mx-2 cursor-pointer"
              [style.backgroundColor]="item.color[0]"
              (click)="selectModel(item)"
            ></li>
          </ul>

          <button class="size-btn-container">
            <span
              onkeypress=""
              *ngFor="let s of sizes"
              class="size-btn cursor-pointer hover:scale-3d"
              [style.backgroundColor]="size === s.value ? 'white' : 'transparent'"
              [style.color]="size === s.value ? 'black' : 'white'"
              (click)="selectSize(s.value)"
            >
              {{ s.label }}
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
