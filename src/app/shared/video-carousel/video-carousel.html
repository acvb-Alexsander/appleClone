<div class="flex flex-col items-center">
  <!-- Viewport: esconde tudo que não é o slide atual -->
  <div class="relative overflow-hidden w-full rounded-3xl">
    <!-- Trilha: 1 slide "de largura total" por item, deslocada via transform -->
    <div
      class="flex transition-transform duration-500 ease-out"
      [style.transform]="'translateX(-' + video().videoId * 100 + '%)'"
    >
      @for (item of hightlightsSlides; track item.id; let i = $index) {
        <div class="w-full flex-shrink-0 sm:pr-20 pr-10">
          <div class="video-carousel-container">
            <div class="w-full h-full flex-center rounded-3xl overflow-hidden bg-black">
              <video
                class="pointer-events-none"
                #videoRef
                [muted]="true"
                preload="auto"
                [attr.data-index]="i"
                (loadedmetadata)="handleLoadedMetadata(i, $event)"
                (ended)="handleVideoEnd(i)"
                (timeupdate)="handleTimeUpdate(i, $event)"
              >
                <source [src]="item.video" type="video/mp4" />
              </video>
            </div>

            <div class="absolute top-12 left-[5%] z-10">
              @for (text of item.textLists; track $index) {
                <p class="md:text-2xl text-xl font-medium">{{ text }}</p>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Controles: indicadores de progresso + botão play/pause -->
  <div class="relative flex-center mt-10 gap-2">
    <div class="flex-center py-5 px-7 bg-gray-300 backdrop-blur rounded-full">
      @for (item of hightlightsSlides; track item.id; let i = $index) {
        <span
          class="mx-2 w-3 h-3 bg-gray-200 rounded-full relative cursor-pointer overflow-hidden"
          (click)="handleDotClick(i)"
        >
          <span
            #videoSpanRef
            class="absolute h-full w-full rounded-full bg-white block"
            loop
            [style.width.%]="i < video().videoId ? 100 : i === video().videoId ? progress() : 0"
          ></span>
        </span>
      }
    </div>

    <button class="control-btn ml-4" (click)="handleProcess()">
      @if (video().isLastVideo) {
        <span aria-label="replay">↺</span>
      } @else if (!video().isPlaying) {
        <span aria-label="play">▶</span>
      } @else {
        <span aria-label="pause">❚❚</span>
      }
    </button>
  </div>
</div>
