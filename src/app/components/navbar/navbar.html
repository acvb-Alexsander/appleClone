<header class="w-full py-5 sm:px-10 px-5 flex justify-between items-center">
  <nav class="flex w-full screen-max-width">
    <img src="{{ appleImg }}" alt="Apple" width="14px" height="18px" />

    <div class="flex flex-1 justify-center max-sm:hidden gap-5">
      @for (nav of navLists; track nav) {
        <div class="text-sm cursor-pointer text-gray hover:text-white transition-all">
          {{ nav }}
        </div>
      }
    </div>
    <div class="flex items-baseline gap-7 max-sm:justify-end max-sm:flex-1">
      <img src="{{ searchImg }}" alt="search" width="18px" height="18px" />
      <img src="{{ bagImg }}" alt="bag" width="18px" height="18px" />
    </div>
  </nav>
</header>
